<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Hub</title>
<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --line:#dde3ea;
  --ink:#202733;
  --muted:#657080;
  --navy:#214461;
  --blue:#2f6f9f;
  --pale:#eaf3f9;
  --accent:#2f6f9f;
  --soft-blue:#f1f7fb;
  --soft-amber:#fff8e7;
  --amber-line:#d8a63d;
  --soft-red:#fff3f1;
  --red-line:#c9786a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Aptos","Inter","Segoe UI Variable","Segoe UI","Noto Sans",
              "Segoe UI Symbol","Noto Sans Symbols 2",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.58;
  overflow-x:hidden
}
button,input,textarea{font:inherit}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;align-items:start}

/* No nested page-scroll boxes: the document itself scrolls. */
aside{
  background:#182433;color:white;padding:20px 18px;
  min-height:100vh;height:auto;position:relative;overflow:visible
}
.brand{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.small{font-size:12px;color:#9ca3af}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
button{border:0;border-radius:9px;padding:8px 11px;cursor:pointer;background:#e5e7eb}
button.primary{background:var(--blue);color:#fff}
button.dark{background:#1f2937;color:#fff;border:1px solid #374151}
button:disabled{opacity:.35;cursor:not-allowed}

.course{padding:10px 12px;border-radius:9px;cursor:pointer;margin:5px 0}
.course:hover,.course.active{background:#1f2937}

main{padding:26px;max-width:1320px;width:100%;min-width:0}
.top{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.search{flex:1;max-width:620px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:white}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #1f29370a}

/* Topic list also grows naturally instead of having its own scrollbar. */
.topics{padding:12px;height:auto;max-height:none;overflow:visible;align-self:start}
.topic{padding:10px 11px;border-radius:9px;cursor:pointer;margin:5px 0;border:1px solid transparent}
.topic.dragover{border-color:var(--accent);background:var(--pale)}
.topic.dragging{opacity:.45}
.topic:hover{background:#f3f4f6}
.topic.active{background:var(--pale);color:#1d4ed8}

.editor{padding:34px 42px;min-height:0;overflow:visible}
.lecture-title{font-size:35px;font-weight:800;letter-spacing:-.035em;line-height:1.16;color:var(--navy);margin:0 0 8px;padding-bottom:12px;border-bottom:2px solid #e8edf2}
.lecture-tags{font-size:12px;color:var(--muted);margin:8px 0 26px;letter-spacing:.015em}
.read-block{margin:0 0 20px;padding-bottom:2px}
.read-block + .read-block{margin-top:10px}
.read-text{font-size:1.02rem;line-height:1.72}
.read-heading{font-size:1.48rem;font-weight:800;letter-spacing:-.018em;line-height:1.25;color:var(--navy);margin:1.55em 0 .65em;padding-bottom:8px;border-bottom:1px solid #dbe3ea}
.read-exam{padding:14px 16px;border:1px solid #ecd9a8;border-left:4px solid var(--amber-line);border-radius:10px;background:var(--soft-amber);font-weight:650}
.modebtn{white-space:nowrap}
.title{font-size:30px;font-weight:800;width:100%;border:0;outline:0;background:transparent;color:var(--ink)}
.tags{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin:8px 0 12px;background:white}

.block{
  border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;
  overflow:visible;background:white
}
.block.dragover{border:2px solid var(--accent);padding:13px}
.block.dragging{opacity:.45;border-style:dashed}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.headleft,.headright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.handle{cursor:grab;user-select:none;background:#f3f4f6;border-radius:7px;padding:5px 8px;font-size:18px;line-height:1;color:var(--muted)}
.handle:active{cursor:grabbing}
.type{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}

/* Text editors expand to their full content: no internal text scrolling. */
textarea{
  width:100%;min-height:90px;height:auto;padding:10px 11px;border:1px solid var(--line);
  border-radius:9px;resize:none;overflow:hidden;line-height:1.55;background:white;color:var(--ink)
}
.preview{margin-top:10px;overflow:visible;overflow-wrap:anywhere}
.preview p{margin:.5em 0}
.preview h1,.preview h2,.preview h3,.preview h4{line-height:1.25;margin:1em 0 .45em}
.preview h2{font-size:1.35rem}.preview h3{font-size:1.18rem}
.preview ul,.preview ol{margin:.45em 0 .75em;padding-left:1.55em}
.preview li{margin:.2em 0}
.preview strong{font-weight:800}
.preview code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f3f4f6;padding:.08em .28em;border-radius:4px}
.preview blockquote{margin:.65em 0;padding:.15em 0 .15em 12px;border-left:3px solid #d1d5db;color:#4b5563}
.preview table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.96em}
.preview th,.preview td{border:1px solid var(--line);padding:8px 9px;vertical-align:top;text-align:left}
.preview th{font-weight:800;background:#f9fafb}
.preview .math-fallback{font-family:"Cambria Math","STIX Two Math","Segoe UI Symbol",serif}

.formula{
  font-family:"Cambria Math","STIX Two Math","Segoe UI Symbol",ui-monospace,monospace;
  background:var(--soft-blue);border:1px solid #d8e8f3;border-left:4px solid var(--blue);padding:14px 16px;border-radius:9px
}
.qa{background:#f8fafc;border:1px solid #e3e8ee;border-radius:10px;padding:11px 13px;margin-top:9px}
.qa summary{font-weight:700;cursor:pointer}
.headingpreview{font-size:22px;font-weight:800;color:var(--navy);margin-top:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.exampreview{margin-top:10px;padding:13px 15px;border-radius:9px;background:var(--soft-amber);border-left:4px solid var(--amber-line);font-weight:650}
.noteimg{max-width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.danger{background:#fee2e2;color:#991b1b}.empty{padding:40px;text-align:center;color:var(--muted)}

/* MathJax equations should never create little inner scroll panes. */
mjx-container{overflow:visible!important;max-width:100%}
mjx-container[display="true"]{margin:1em 0!important}
.MathJax{overflow:visible!important}


/* Note-style hierarchy: subtle emphasis, not a rainbow. */
.preview p{margin:.42em 0 .75em}
.preview ul,.preview ol{margin:.35em 0 .85em;padding-left:1.45em}
.preview li{margin:.28em 0;padding-left:.12em}
.preview strong{font-weight:750;color:#172c3e}
.preview strong.key-term{
  font-weight:800;
  color:var(--navy);
}
.preview mark{
  background:#fff0a8;
  color:inherit;
  padding:.03em .18em;
  border-radius:3px;
}
.minihead{
  font-size:1.03rem;
  font-weight:800;
  color:var(--navy);
  margin:1.05em 0 .3em;
  letter-spacing:-.008em;
}
.key-callout{
  margin:.85em 0;
  padding:11px 14px;
  background:var(--soft-red);
  border-left:4px solid var(--red-line);
  border-radius:8px;
  font-weight:650;
}
.read-exam::before{
  content:"LECTURER’S EXAM HINT";
  display:block;
  font-size:.76rem;
  letter-spacing:.06em;
  color:#795b16;
  font-weight:850;
  margin-bottom:5px;
}
.read-block .noteimg{
  margin:14px auto 6px;
  max-height:620px;
  object-fit:contain;
}
.qa summary{
  color:var(--navy);
  font-weight:750;
}
.topics{
  background:#fbfcfd;
}
.topic.active{
  background:#e9f2f8;
  color:#204e70;
}
.search{
  font-family:inherit;
  box-shadow:0 1px 2px #00000008;
}


/* Saved notes/questions sit beside the exact section they belong to.
   Empty note spaces are not shown in reading mode. Editing stays in Edit mode. */
.read-pair{
  display:grid;
  grid-template-columns:minmax(0,1fr) 190px;
  gap:18px;
  align-items:start;
  margin-bottom:18px;
}
.read-pair.no-note{
  grid-template-columns:minmax(0,1fr);
}
.read-main{min-width:0}
.side-note{
  position:relative;
  min-height:0;
  height:auto;
  align-self:start;
  background:#fff4b8;
  border:1px solid #eadb82;
  border-radius:8px 8px 10px 8px;
  padding:11px 11px 12px;
  box-shadow:0 3px 8px #1f293711;
  transform:rotate(-0.18deg);
}
.side-note.question{
  background:#eef5ff;
  border-color:#c9d9ee;
  transform:rotate(.15deg);
}
.side-note::after{
  content:"";
  position:absolute;
  right:10px;
  top:-5px;
  width:46px;
  height:9px;
  background:#ffffff8a;
  border:1px solid #ffffff99;
  transform:rotate(2deg);
}
.side-note-label{
  font-size:.67rem;
  font-weight:850;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#6c5d20;
  margin-bottom:4px;
}
.side-note.question .side-note-label{color:#365e86}
.side-note-text{
  font-size:.88rem;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  max-height:320px;
  overflow-y:auto;
}

/* Note editor appears only in Edit / arrange mode. */
.block-note-editor{
  margin-top:12px;
  padding:11px 12px;
  border:1px dashed #d8c86f;
  background:#fffaf0;
  border-radius:8px;
}
.block-note-editor .small{color:#786a2c!important}
.block-note-editor textarea{
  background:#fffdf3;
  border-color:#dfcf78;
}
.block-note-editor select{
  width:100%;
  margin:7px 0;
  padding:7px 8px;
  border:1px solid #dccf87;
  border-radius:7px;
  background:#fffef8;
  font:inherit;
  font-size:.86rem;
}
@media(max-width:900px){
  .read-pair,.read-pair.no-note{grid-template-columns:1fr}
  .side-note{transform:none}
  .side-note.question{transform:none}

  .app{grid-template-columns:1fr}
  aside{min-height:auto}
  main{padding:14px}
  .layout{grid-template-columns:1fr}
  .topics{height:auto;max-height:none;overflow:visible}
  .top{align-items:stretch;flex-direction:column}
  .search{max-width:none;width:100%}
  .editor{padding:22px 18px}
}
</style>

<div class="app">
<aside><div class="brand">Study Hub</div><div class="small">Editable notes, images and exam Q&A</div><div class="row"><button class="primary" onclick="addCourse()">+ Course</button><button class="dark" onclick="exportData()">Export</button><button class="dark" onclick="imp.click()">Import</button><input id="imp" type="file" accept=".json" hidden onchange="importData(event)"></div><div id="courses"></div><p class="small">Auto-saves in this browser. Export a backup before moving computers.</p></aside>
<main><div class="top"><input id="search" class="search" placeholder="Search notes..." oninput="renderTopics()"><button id="modeBtn" class="modebtn" onclick="toggleMode()">Edit / arrange</button><span id="status" class="small" style="color:#6b7280">Saved · compact notes beside their section</span></div><div class="layout"><section class="panel topics"><div class="row" style="margin-top:0"><button class="primary" onclick="addTopic()">+ Topic</button><button onclick="renameCourse()">Rename</button></div><div id="topics"></div></section><section id="editor" class="panel editor"><div class="empty">Choose a topic.</div></section></div></main>
</div>

const starter={courses:[
{name:'CIVIL 200',topics:[
{title:'Rock & Weathering',tags:'rock weathering exam',blocks:[{type:'text',text:'Three-mark weathering rule: one type + one example + what changes.\n\nPhysical/mechanical: breaks rock without changing mineral chemistry.\nChemical: dissolves or alters minerals. Slightly acidic water dissolving minerals/limestone is a good example.\nBiological: roots or organisms widen cracks and can assist chemical alteration.'},{type:'qa',q:'What four discontinuity ideas should I remember?',a:'Orientation = which way the crack slopes/faces. Spacing = how far apart cracks are. Condition = rough/smooth, open/closed, weathered or infilled. Groundwater = whether water/seepage is present.'}]},
{title:'Soil Classification & Gradation',tags:'sieve Cu Cc D10 D30 D60',blocks:[{type:'text',text:'NZ particle sizes:\nGravel: 2–60 mm\nSand: 0.06–2 mm\nSilt: 0.002–0.06 mm\nClay: <0.002 mm'},{type:'formula',text:'Cu = D60 / D10\nCc = (D30)^2 / (D60 × D10)\n\nSand well graded: Cu ≥ 6 and 1 ≤ Cc ≤ 3\nGravel well graded: Cu ≥ 4 and 1 ≤ Cc ≤ 3'},{type:'text',text:'D10, D30 and D60 are particle sizes at 10%, 30% and 60% passing. Cu/Cc tell you well-graded vs poorly graded; they do not tell you fine vs coarse sand.'}]},
{title:'Phase Relationships',tags:'wc A e n Sr Gs',blocks:[{type:'formula',text:'wc = Mw / Ms = Ww / Ws\ne = Vv / Vs\nn = Vv / V\nSr = Vw / Vv\nA = Va / V\nGs = ρs / ρw = Ws / (Vs γw)'},{type:'text',text:'Memory:\nwc = water vs solids\ne = voids vs solids\nn = voids vs total\nSr = water vs voids\nA = air vs total\nGs = solids compared with water'}]},
{title:'Effective Stress',tags:'stress water table pore pressure',blocks:[{type:'formula',text:"σ' = σ − u\nu = γw h\nγ = ρg"},{type:'text',text:'Workflow: split depth into material sections → total stress Σ(γh) → pore pressure u below water table → subtract to get effective stress.'}]},
{title:'Permeability & Seepage',tags:'Darcy seepage head gradient',blocks:[{type:'formula',text:'ht = u/γw + z\ni = Δh/L\nv = ki\nq = kiA = vA\nvs = v/n'},{type:'text',text:'Darcy velocity v uses the full soil cross-section. Seepage velocity vs is the actual average through the voids, so vs > v. Water flows from high total head to low total head.'}]},
{title:'Atterberg Limits',tags:'LL PL PI LI',blocks:[{type:'formula',text:'PI = LL − PL\nLI = (wc − PL) / PI'},{type:'text',text:'Liquid limit LL = moisture content at 25 blows on the Casagrande curve. PI is the water-content range over which soil is plastic.'}]},
{title:'Past Paper — 9 Questions',tags:'past paper exam',blocks:[
{type:'qa',q:'1. Intrusive vs extrusive igneous rocks?',a:'Intrusive igneous rocks generally have more desirable engineering properties. Slow cooling underground tends to produce interlocking crystals and relatively uniform, low-porosity rock material. Extrusive deposits may contain gas holes, volcanic fragments and variable layers that create weaknesses.'},
{type:'qa',q:'2. Why is rock mass often weaker than intact rock?',a:'Intact rock is continuous material. Rock mass contains joints, fractures, bedding and faults that form planes of weakness and allow movement or water flow.'},
{type:'qa',q:'3. Moist fine soil: shaking brings water to surface; squeezing makes it disappear?',a:'Silt. This marked shake-and-squeeze response is dilatancy.'},
{type:'qa',q:'4. Silt vs clay in the field?',a:'Silt: little plasticity, marked dilatancy, weaker dry lumps. Clay: plastic, stronger dry lumps, little/no dilatancy.'},
{type:'qa',q:'5. Soil characteristics affecting seepage?',a:'Grain-size distribution, fines content, void ratio and pore size/continuity. Hydraulic gradient drives flow but is not a soil characteristic.'},
{type:'qa',q:'6. Rock material vs rock mass?',a:'Rock material is intact rock between defects. Rock mass includes the material plus joints, bedding and faults, so orientation, spacing, condition and water also matter.'},
{type:'qa',q:'7. Three weathering processes?',a:'Physical/mechanical breaks rock without changing minerals. Chemical dissolves or alters minerals. Biological action such as roots widens cracks and may assist chemical alteration.'},
{type:'qa',q:'8. What should be described for a discontinuity?',a:'Type, orientation, spacing, persistence, aperture, roughness, infill, weathering and water/seepage condition.'},
{type:'qa',q:'9. Outcrop to sedimentary soil/rock?',a:'Weathering → erosion → transport → deposition → burial/compaction/cementation.'}
]}]},

const ENVENG_W2L1={"title":"Week 2 Lecture 1 - Wastewater Sources and Characteristics","tags":"ENVENG 200 week 2 lecture 1 wastewater BOD COD TSS nutrients greywater blackwater point source non-point source collection transport","blocks":[{"type":"heading","text":"Lecture overview"},{"type":"text","text":"Learning goals\n• Identify common sources and types of wastewater.\n• Explain the main goals of wastewater treatment.\n• Describe important wastewater quality parameters such as BOD, TSS and nutrients.\n• Explain environmental impacts of untreated wastewater.\n• Understand how wastewater is collected and transported to a wastewater treatment plant (WWTP)."},{"type":"heading","text":"1. What is wastewater?"},{"type":"text","text":"Wastewater = water that has been affected by human use.\n\nIt can include water from toilets, sinks, showers, industry and, in some systems, stormwater. It may contain physical, chemical and biological contaminants, so it normally requires treatment before discharge or reuse.\n\nWhy can stormwater be included? Older sewer systems may combine stormwater and wastewater in one pipe. Newer systems usually separate them."},{"type":"text","text":"Why wastewater treatment matters\n• Untreated wastewater can spread disease.\n• It can pollute rivers, lakes and oceans and harm ecosystems.\n• Wastewater can also contain useful resources such as nutrients and energy that may be recovered.\n• Environmental engineers design systems to protect public health and the environment."},{"type":"heading","text":"2. Main sources of wastewater"},{"type":"text","text":"Four main sources used in this course:\n1. Domestic - toilets, kitchens, laundry, showers.\n2. Commercial - restaurants, hotels, laundromats.\n3. Industrial - food processing, chemicals, factories and other industrial processes.\n4. Infiltration/Inflow - stormwater or groundwater entering sewers, including groundwater entering through cracks.\n\nWhy the source matters: different sources contain different contaminants. Knowing the source helps predict the pollutants and therefore the treatment that may be needed."},{"type":"heading","text":"3. Potable water, greywater and blackwater"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIEAwUGAQcI/8QATRAAAgICAQIDBgQEAwQGCAQHAAECAwQRBRIhBhMxFCJBUWFxBzKBkRUjQqFSscEWM2JyJDaSstHhQ1NUc3SCovAXJTXSJjRjg5PC8f/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAyEQEAAgEDAwMCBAUEAwAAAAAAAQIRAxIhMUFRBBMiYXGBkcHwFCMyoeFCUmLRgrHx/9oADAMBAAIRAxEAPwD7iAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD59+JnOc1webg2cdlurGthJOPRF7nF7+K+T/sdpHkK5cOuSfar2fz39F09R0tpzFYt5c41Im018LoPk/gvxry+d4mx8bksvzMbJco9HRFKMmtx1pfTR2X4hc1kcJ4fldhWKvJttjXXLSevi3p/RM3bQtW8UnrLNdatqTeOzpgaLwXk52X4aw8rlLnbkXRc3JxUfdbevT6G3hl41lnlwyKpT/wAKmm/2OVqzEzHh0raJiJZgDD7Vj+b5Xn1eZ/g61v8AYy0zA0XjDnpeHuIebXTC6zzIwUJT6fX4ljwzy/8AGuFxc ater sources.\n\nGreywater\nUsed water that does not contain excrement/faeces or toxic contaminants. Common examples: baths, sinks and washing machines. It may sometimes be reused, for example for watering a garden.\n\nBlackwater\nMore contaminated wastewater containing faeces/excrement and/or toxic chemicals. Sources include toilets and some industrial processes.\n\nIMPORTANT TRAP: water that looks black is not automatically blackwater. Classification depends on what contaminants are present, not colour alone."},{"type":"heading","text":"4. Main goals of wastewater treatment"},{"type":"text","text":"There are three main goals:\n\n1. Produce clean effluent\nRemove pollutants such as TSS, dissolved organics, pathogens and nutrients so discharge/reuse requirements can be met.\n\n2. Produce stabilised solid waste (sludge)\nThe solids removed from wastewater still need treatment. Important goals include killing pathogens and preventing odour. Properly treated sludge may be used as biosolids.\n\n3. Resource recovery\nWhere possible, recover useful materials such as nitrogen, phosphorus, water/reuse, biogas or energy. This supports a more circular and sustainable treatment process."},{"type":"heading","text":"5. Wastewater characteristics"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAgMEAQf/xABREAACAgECAwIHCwgJAgQGAwAAAQIDBAURBhIhEzEUFkFRU2GTByIyNnF0gZGSsdEVIzNSVFVzoRc0NTdCcpSywVZiJHWiwiVDgrPS4USD8P/EABsBAQADAQEBAQAAAAAAAAAAAAABAgMEBQYH/8QANxEBAAIBAgUDAQcEAgEEAwAAAAECEQMSEyExUWEEMkEUBSJxgZGh0QZCwfAzseEVQ1JTIyTx/9oADAMBAAIRAxEAPwD7iAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//Z","caption":"Lecture slide: physical, chemical and biological wastewater characteristics."},{"type":"text","text":"Physical characteristics\nTurbidity, colour, odour, total solids and temperature.\n\nChemical characteristics\nBOD, COD, TOC, nitrogen, phosphorus, chlorides, sulphates, alkalinity, dissolved oxygen and pH.\n\nBiological characteristics\nBacteria, algae, fungi, viruses and protozoa.\n\nThese characteristics help determine both the treatment method and the likely environmental impact."},{"type":"heading","text":"6. Solids in wastewater"},{"type":"formula","text":"Total Solids (TS) = Total Suspended Solids (TSS) + Total Dissolved Solids (TDS)"},{"type":"text","text":"TSS - suspended particles; can be removed by filtration.\nTDS - dissolved material; passes through the filter, so other treatment is needed.\nSettleable solids - solids that sink during sedimentation.\n\nWhy solids matter: excessive solids can accumulate as sludge, clog systems and create treatment problems."},{"type":"heading","text":"7. Temperature, odour and colour"},{"type":"text","text":"Temperature - affects microbial activity and oxygen solubility. Higher temperature can speed biological processes but reduce dissolved oxygen.\n\nOdour - can be caused by gases such as hydrogen sulphide (H₂S) and ammonia produced during decomposition. Odour is also important for community/public acceptance.\n\nColour - may indicate industrial discharge or aged sewage. Appearance matters, but colour alone does not identify the wastewater type."},{"type":"heading","text":"8. Biochemical Oxygen Demand (BOD)"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAUBAgMEBgcI/8QAUxAAAQMDAgMEBgYHBQUFBwQDAQACAwQFERIhBhMxQV d to break down organic material in water.\n\nThink of it like this:\nMore biodegradable organic matter → more microbial activity → more oxygen used → lower dissolved oxygen in the water.\n\nWhy high BOD is a problem: if microorganisms use too much dissolved oxygen, fish and other aquatic organisms may not have enough oxygen.\n\nBOD is useful, but the usual BOD test is slow and commonly takes about 5 days."},{"type":"heading","text":"9. Chemical Oxygen Demand (COD) and BOD vs COD"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAMFAQQGAgf/xABSEAABBAIAAwQFCAgDBAkCBQUBAAIDBAUREiExBhNBURQiMmFxBxVTgZGSsdEjMzRCUnOhwRY1ciQ2YrJDRFR0gpPC4fAXoiUmN0XxR2Ojs9L/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QANBEAAgIBAgUBBwQCAgMBAQAAAAECEQMhMQQSE0FRYSJxgaGxwfAUMpHRBeFS8SMzQjRi/9oADAMBAAIRAxEAPwD7iiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgC n contribute to eutrophication.\n\nPhosphorus\nMainly discussed as phosphate (PO₄³⁻). Excess phosphorus can promote algal blooms.\n\nNutrients often need additional/tertiary treatment to protect receiving ecosystems."},{"type":"heading","text":"11. Environmental impacts of untreated wastewater"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAYCAwQFBwEI/8QAUxAAAQQCAAQDBAQKBwUFBwMFAQACAwQFEQYSITETQVEUImFxBzKBkRUXQlJVkqGxstEWIzM1U3J0Njdic8EkNEOCs0RUg5PC4fAldYRFY3ai0v/EABoBAQADAQEBAAAAAAAAAAAAAAABAgMEBQb/xAAzEQEAAgECBgACCQUAAwEAAAAAAQIRAxIEEyExQVEUgQUiIzJCYXGRwTNSodHwYrHhFf/aAAwDAQACEQMRAD8A7iiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIi rom low-lying areas or moved over higher ground.\n• The system should move wastewater efficiently so solids do not settle. Slow flow can contribute to blockages, odour and corrosion.\n• Pipe cracks/defects are also important because wastewater can leak out and groundwater can infiltrate in."},{"type":"exam","text":"DO NOT MEMORISE THE EXACT 0.6 m/s VALUE: the lecturer explicitly said the specific velocity value would not be asked. Know the reason instead: keep wastewater moving efficiently to prevent solids settling, blockages, odour/corrosion, while using gravity to minimise power where possible."},{"type":"heading","text":"14. Domestic vs industrial wastewater"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAwQHAQL/xABYEAABBAIBAgMFBAUIBQcICQUBAAIDBAURBhIhEzFBBxQiUWEycYGRFRZSVJIjNUJTc6GxsjNicsHRFyQ2N3STsyU0Q4KiwuHxGCYnREVjddLwCFV2g6P/xAAbAQEAAwEBAQEAAAAAAAAAAAAAAQIDBAUGB//EADURAQABAwEFBwMDBAIDAQAAAAABAgMRBBIUITFSBRVBUXGh4RMyMyI0sWFygcGR8CNC0fH/2gAMAwEAAhEDEQA/AO4oiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiIC EREBERAREQf/9k=","caption":"Lecture slide: domestic vs industrial wastewater."},{"type":"text","text":"Domestic wastewater\nUsually has relatively consistent composition because household sources are similar. Common concerns include BOD, nutrients and pathogens.\n\nIndustrial wastewater\nMuch more variable because different industries use different processes. It may contain toxic or non-biodegradable substances, and its pH and temperature may vary more.\n\nBecause of this variability and potential toxicity, industrial wastewater often requires pre-treatment before entering public sewers."},{"type":"heading","text":"15. New Zealand discharge quality - lecture examples"},{"type":"text","text":"In New Zealand, wastewater discharge quality is controlled through resource consents issued by regional councils, so limits can vary by region.\n\nExample values shown on the lecture slide for surface-water discharge:\n• BOD < 20-50 mg/L\n• TSS < 30 mg/L\n• pH 6-9\n• Ammoniacal nitrogen (NH₄⁺) < 10 mg/L\n• Faecal coliforms < 1,000 CFU/100 mL\n\nTreat these as the lecture slide examples; the lecturer emphasised that NZ requirements are regional rather than one single nationwide discharge limit."},{"type":"heading","text":"16. Lecture example - domestic wastewater sample"},{"type":"text","text":"Example sample from the slide:\nBOD₅ = 250 mg/L\nCOD = 500 mg/L\nTSS = 220 mg/L\npH = 7.2\nNH₄⁺ = 35 mg/L\n\nSlide interpretation: high-strength domestic wastewater requiring full secondary and nutrient treatment."},{"type":"exam","text":"EXAM HINT: The lecturer said you are NOT expected to memorise what numerical ranges count as “high strength”. If that kind of classification were required, the relevant ranges would need to be supplied."},{"type":"heading","text":"17. Quick exam-style Q&A"},{"type":"qa","q":"What is wastewater?","a":"Water that has been affected by human use and may contain physical, chemical and biological contaminants."},{"type":"qa","q":"Why can stormwater sometimes be part of a wastewater stream?","a":"Older systems may use combined sewers, so stormwater and wastewater enter the same pipe."},{"type":"qa","q":"What are the four main wastewater sources used in this course?","a":"Domestic, commercial, industrial, and infiltration/inflow."},{"type":"qa","q":"Why is identifying the wastewater source important?","a":"Different sources contain different contaminants, so the source helps predict what treatment may be needed."},{"type":"qa","q":"What is greywater?","a":"Used water without faeces/excrement or toxic contaminants, such as water from baths, sinks or washing machines."},{"type":"qa","q":"What is blackwater?","a":"More contaminated wastewater containing faeces/excrement and/or toxic chemicals, such as toilet wastewater and some industrial wastewater."},{"type":"qa","q":"Does dark or black-looking water automatically mean blackwater?","a":"No. Blackwater is classified by its contaminants, not by its colour."},{"type":"qa","q":"What are the three main goals of wastewater treatment?","a":"Produce clean effluent, produce stabilised sludge/solid waste, and recover useful resources where possible."},{"type":"qa","q":"What is the relationship between TS, TSS and TDS?","a":"Total Solids (TS) = Total Suspended Solids (TSS) + Total Dissolved Solids (TDS)."},{"type":"qa","q":"What does BOD measure?","a":"The amount of dissolved oxygen microorganisms need to break down biodegradable organic material."},{"type":"qa","q":"Why can high BOD harm aquatic life?","a":"Microorganisms use more dissolved oxygen while breaking down organic matter, leaving less oxygen available for aquatic organisms."},{"type":"qa","q":"What is the main difference between BOD and COD?","a":"BOD relies on microorganisms and mainly reflects biodegradable organics; COD uses chemical oxidation, includes biodegradable and non-biodegradable organics, and is faster."},{"type":"qa","q":"What can excess nitrogen and phosphorus cause?","a":"Eutrophication and algal blooms."},{"type":"qa","q":"What is a point source?","a":"A specific, easily identifiable discharge location, such as a pipe or outlet."},{"type":"qa","q":"What is a non-point source?","a":"Pollution from many scattered sources or broad areas that cannot be traced to one exact discharge point."},{"type":"qa","q":"Why is gravity flow preferred in wastewater collection?","a":"It transports wastewater without needing as much pumping energy."},{"type":"qa","q":"Why should wastewater not move too slowly through sewers?","a":"Solids can settle, causing blockage, odour and corrosion problems."},{"type":"qa","q":"How does industrial wastewater differ from domestic wastewater?","a":"Industrial wastewater is usually more variable and may contain toxic or non-biodegradable substances, so it often needs pre-treatment."},{"type":"heading","text":"18. Cram summary"},{"type":"text","text":"If you are short on time, remember these:\n\n1. Wastewater = water affected by human use.\n2. Main sources = domestic, commercial, industrial, infiltration/inflow.\n3. Greywater ≠ faeces/toxic contaminants; blackwater contains faeces and/or toxic contaminants.\n4. Treatment goals = clean effluent + safe/stabilised sludge + resource recovery.\n5. TS = TSS + TDS.\n6. BOD = oxygen used by microbes to break down organics; high BOD can deplete dissolved oxygen.\n7. COD = chemical oxidation; faster and includes a wider range of organics; COD is usually > BOD.\n8. N and P can cause eutrophication/algal blooms.\n9. Point source = exact identifiable outlet; non-point = broad/scattered runoff. THIS CAN BE ASSESSED.\n10. Collection = gravity where possible + pumps where needed; keep flow moving to avoid settling/blockages."},{"type":"text","text":"Sources used for these notes: lecture slides “Wastewater Sources and Characteristics”, the lecture captions/transcript, and the standalone point-source vs non-point-source slide."}]};


const ENVENG_MODULE1_KNOW={"title":"Module 1 - What I Need to Know","tags":"ENVENG 200 module 1 must know key concepts wastewater sources characteristics BOD COD TSS TDS nutrients point source non-point source collection transport","blocks":[{"type":"heading","text":"What the lecturer basically said you need to know"},{"type":"text","text":"This page pulls together the **main concepts** the lecturer highlighted in the recording, especially the recap near the end. It is meant to be the **shortlist of what to actually learn** from this module/lecture rather than every little detail on every slide.\n\nFrom the lecturer’s recap, the key ideas were:\n• what wastewater is\n• the **main sources** of wastewater\n• the **main goals** of wastewater treatment\n• the important **wastewater characteristics/parameters**\n• why untreated wastewater is harmful\n• how wastewater is **collected and moved** to the treatment plant using **gravity** and **pump stations**."},{"type":"heading","text":"1. Start with the big picture"},{"type":"text","text":"If you are trying to study smart, make sure you can explain these without notes:\n1. **What is wastewater?**\n2. **Where does it come from?**\n3. **Why do we treat it?**\n4. **What are the important things measured in it?**\n5. **How can it harm the environment if untreated?**\n6. **How is it collected and transported to a WWTP?**\n\nIf you can do those six, you already have most of this lecture covered."},{"type":"heading","text":"2. Wastewater overview image"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAgMEAQf/xABREAACAgECAwIHCwgJAgQGAwAAAQIDBAURBhIhEzEUFkFRU2GTByIyNnF0gZGSsdEVIzNSVFVzoRc0NTdCcpSywVZiJHWiwiVDgrPS4USD8P/EABsBAQADAQEBAQAAAAAAAAAAAAABAgMEBQYH/8QANxEBAAIBAg AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//Z","caption":"Lecture image: the lecturer grouped wastewater characteristics into **physical**, **chemical** and **biological** characteristics."},{"type":"text","text":"This is one of the best memory images from the lecture.\n\nMake sure you know the three groups:\n• **Physical characteristics** – things like turbidity, colour, odour, total solids, temperature.\n• **Chemical characteristics** – things like **BOD**, **COD**, nutrients such as **nitrogen** and **phosphorus**, pH, chlorides and others.\n• **Biological characteristics** – organisms such as bacteria, viruses, algae, fungi and protozoa.\n\nWhy this matters: these characteristics help determine both the **treatment method** and the **environmental impact**."},{"type":"heading","text":"3. Wastewater classification: potable water vs greywater vs blackwater"},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIEAwUGAQcI/8QATRAAAgICAQIDBgQEAwQGCAQHAAECAwQRBRIhBhMxFCJBUWFxBzKBkRUjQqFSscEWM2JyJDaSstHhQ1NUc3SCovAXJTXSJjRjg5PC8f/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAyEQEAAgEDAwMCBAUEAwAAAAAAAQIRAxIhMUFRBBMiYXGBkcHwFCMyoeFCUmLRgrHx/9oADAMBAAIRAxEAPwD7iAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//9k=","caption":"Lecture image: classification of potable water, greywater and blackwater."},{"type":"text","text":"You should know the difference clearly:\n• **Potable (clean) water** – safe for human and animal consumption.\n• **Greywater** – used water **without excrement/faeces** and without toxic contaminants; examples include water from baths, sinks and washing machines.\n• **Blackwater** – more contaminated water containing **excrement/faeces and/or toxic chemicals**; examples include toilet wastewater and some industrial wastewater.\n\n**Common trap:** blackwater is **not** defined by looking black in colour. It is defined by the type of contamination."},{"type":"heading","text":"4. Main sources of wastewater you should know"},{"type":"text","text":"Know these four source groups:\n1. **Domestic** – toilets, kitchens, laundry, showers.\n2. **Commercial** – restaurants, hotels, laundromats and similar activities.\n3. **Industrial** – factories and industrial processes.\n4. **Infiltration/Inflow** – groundwater or stormwater entering sewers, often through cracks or unwanted connections.\n\nWhy the source matters: once you know the source, you can start predicting **what pollutants are likely to be present** and therefore **what treatment may be needed**."},{"type":"heading","text":"5. Goals of wastewater treatment"},{"type":"text","text":"The lecture kept returning to three main goals:\n• produce a **clean effluent**\n• handle the **sludge/solids safely**\n• recover useful **resources** where possible\n\nExamples of resource recovery mentioned in the lecture included **nutrients** and **energy** (for example, biogas/biofuels)."},{"type":"heading","text":"6. Water-quality concepts you really need to know"},{"type":"text","text":"These are the core concepts that are worth learning properly:\n\n**Solids**\n• **TS = TSS + TDS**\n• **TSS** = total suspended solids, i.e. particles floating in the water.\n• **TDS** = total dissolved solids, i.e. dissolved material in the water.\n\n**BOD**\n• **Biochemical Oxygen Demand**\n• the amount of dissolved oxygen microorganisms need to break down biodegradable organic matter\n• high BOD usually means more biodegradable organic pollution\n\n**COD**\n• **Chemical Oxygen Demand**\n• oxygen equivalent needed to chemically oxidise organics\n• generally faster to measure than BOD\n• usually includes a wider range of organics, so **COD is often greater than BOD**\n\n**Nutrients**\n• especially **nitrogen (N)** and **phosphorus (P)**\n• too much of these can cause **eutrophication** and **algal blooms**\n\n**Pathogens**\n• important because untreated wastewater can spread disease.\n\n**pH**\n• important because it affects treatment and biological activity."},{"type":"image","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4QDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAMFAQQGAgf/xABSEAABBAIAAwQFCAgDBAkCBQUBAAIDBAUREiExBhNBURQiMmFxBxVTgZGSsdEjMzRCUnOhwRY1ciQ2YrJDRFR0gpPC4fAXoiUmN0XxR2Ojs9L/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QANBEAAgIBAgUBBwQCAgMBAQAAAAECEQMhMQQSE0FRYSJxgaGxwfAUMpHRBeFS8SMzQjRi/9oADAMBAAIRAxEAPwD7iiIgCIiAIiIAiIg EQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERB//Z","caption":"Lecture image: wastewater collection and transport to a **WWTP**."},{"type":"text","text":"You should know the basic idea:\n• wastewater is collected through a **network of pipes**\n• it moves mainly by **gravity flow** where possible\n• **pump stations** are used when the water needs to be lifted, for example from low-lying areas or over hills, to reach the **WWTP**\n\nYou should also know **why keeping the water moving matters**:\n• if flow is too slow, solids can settle\n• this can cause **blockages**\n• it can also contribute to **odour/fermentation problems** and **pipe corrosion**"},{"type":"exam","text":"**\"I will not ask you this specific detail, but just know that we are trying to keep the water flowing as fast and efficiently as possible to avoid any of those problems.\"**\n\nTranslation: you do **not** need to memorise the **0.6 m/s** value, but you **do** need to know the **reason** for maintaining flow."},{"type":"heading","text":"9. Things the lecturer basically said not to memorise exactly"},{"type":"exam","text":"**\"I don't really expect you to know this okay.\"**\n**\"Don't expect you to know what is high strength.\"**\n\nThis was said when discussing whether a wastewater sample should be called **high-strength**. So learn the **idea** that some wastewaters are stronger/more contaminated than others, but do **not** spend time trying to memorise exact classification ranges unless the lecturer provides them."},{"type":"heading","text":"10. If you only learn one checklist, learn this"},{"type":"text","text":"**Must-know checklist**\n• wastewater = water affected by human use\n• source groups = **domestic, commercial, industrial, infiltration/inflow**\n• water types = **potable water, greywater, blackwater**\n• treatment goals = **clean effluent, safe sludge, resource recovery**\n• characteristics = **physical, chemical, biological**\n• core parameters = **TSS, TDS, BOD, COD, nutrients, pH, pathogens**\n• environmental harm = disease spread, oxygen depletion, eutrophication, ecological damage\n• source identification = **point source vs non-point source**\n• collection/transport = **pipes + gravity + pump stations + WWTP**\n• what not to memorise exactly = the **0.6 m/s detail** and the exact **high-strength classification ranges**"},{"type":"text","text":"Sources used for this summary: the lecture slides **Wastewater Sources and Characteristics**, the standalone **Point Sources vs Non-Point Sources of Pollution** slide, and the lecture captions/transcript. Where the captions were messy, wording has been cleaned up while keeping the lecturer’s meaning."}]};

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function inlineRich(s=''){
  let x=esc(s);

  // Manual highlighting syntax: ==important text==
  x=x.replace(/==([^=]+)==/g,'<mark>$1</mark>');

  // Automatically emphasise a small set of core engineering terms.
  // Kept deliberately selective so the page does not become visually noisy.
  const terms=[
    'Biochemical Oxygen Demand','Chemical Oxygen Demand',
    'point source','non-point source',
    'greywater','blackwater',
    'BOD₅','BOD','COD','TSS','TDS','WWTP',
    'chemical equivalence','equivalent weight','alkalinity','hardness',
    'carbonate hardness','non-carbonate hardness','total solids',
    'total fixed solids','total volatile solids','electrical conductivity',
    'eutrophication','resource recovery',
    'gravity flow','pump stations'
  ];
  terms.forEach(term=>{
    const safe=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    x=x.replace(new RegExp(`\\b(${safe})\\b`,'gi'),'<strong class="key-term">$1</strong>');
  });

  x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
  x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  x=x.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,;:!?])/g,'$1<em>$2</em>');
  return x;
}
function isTableDivider(line=''){
  return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
}
function cells(line=''){
  let s=line.trim();
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split('|').map(v=>v.trim());
}
function rich(s=''){
  const lines=String(s).replace(/\r/g,'').split('\n');
  let out='',i=0,list=null;
  const closeList=()=>{if(list){out+=`</${list}>`;list=null}};
  while(i<lines.length){
    const line=lines[i];

    // Markdown table: header row + divider + body rows.
    if(line.includes('|') && i+1<lines.length && isTableDivider(lines[i+1])){
      closeList();
      const head=cells(line);
      i+=2;
      const rows=[];
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){
        rows.push(cells(lines[i])); i++;
      }
      out+='<table><thead><tr>'+head.map(c=>`<th>${inlineRich(c)}</th>`).join('')+'</tr></thead><tbody>';
      out+=rows.map(r=>'<tr>'+r.map(c=>`<td>${inlineRich(c)}</td>`).join('')+'</tr>').join('');
      out+='</tbody></table>';
      continue;
    }

    if(!line.trim()){closeList();out+='<div style="height:.35em"></div>';i++;continue}

    const trimmed=line.trim();
    const miniHeads=new Set([
      'Learning goals',
      'Why wastewater treatment matters',
      'Four main sources used in this course:',
      'Potable / clean water',
      'Greywater',
      'Blackwater',
      'There are three main goals:',
      'Physical characteristics',
      'Chemical characteristics',
      'Biological characteristics',
      'Think of it like this:',
      'Key comparison:',
      'pH',
      'Nitrogen',
      'Phosphorus',
      'Major impacts:',
      'Point source',
      'Non-point source',
      'Domestic wastewater',
      'Industrial wastewater',
      'Example sample from the slide:',
      'Slide interpretation:',
      'If you are short on time, remember these:',
      'Sources used for these notes:'
    ]);
    if(miniHeads.has(trimmed)){
      closeList();out+=`<div class="minihead">${inlineRich(trimmed)}</div>`;i++;continue
    }
    if(/^IMPORTANT(?:\s+TRAP)?\s*:/i.test(trimmed)){
      closeList();out+=`<div class="key-callout">${inlineRich(trimmed)}</div>`;i++;continue
    }

    let m;
    if((m=line.match(/^(#{1,4})\s+(.+)$/))){
      closeList();const n=m[1].length;out+=`<h${n}>${inlineRich(m[2])}</h${n}>`;i++;continue
    }
    if((m=line.match(/^\s*(?:[-*]|•)\s+(.+)$/))){
      if(list!=='ul'){closeList();list='ul';out+='<ul>'}
      out+=`<li>${inlineRich(m[1])}</li>`;i++;continue
    }
    if((m=line.match(/^\s*(\d+)\.\s+(.+)$/))){
      if(list!=='ol'){closeList();list='ol';out+='<ol>'}
      out+=`<li>${inlineRich(m[2])}</li>`;i++;continue
    }
    if((m=line.match(/^\s*>\s?(.*)$/))){
      closeList();out+=`<blockquote>${inlineRich(m[1])}</blockquote>`;i++;continue
    }
    closeList();
    out+=`<p>${inlineRich(line)}</p>`;i++;
  }
  closeList();
  return out;
}
function nl(s=''){return rich(s)}

function grow(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.max(90,el.scrollHeight+2)+'px';
}
function growAll(){
  document.querySelectorAll('#editor textarea').forEach(grow);
}
function typesetMath(){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([document.getElementById('editor')]).catch(()=>{});
  }
}
function cur(){return state.courses[ci]?.topics[ti]}
function renderAll(){renderCourses();renderTopics();renderEditor()}
function renderCourses(){courses.innerHTML=state.courses.map((c,i)=>`<div class="course ${i===ci?'active':''}" onclick="ci=${i};ti=0;renderAll()">${esc(c.name)}</div>`).join('')}
function renderTopics(){let q=search.value.toLowerCase().trim(),c=state.courses[ci];topics.innerHTML=(c?.topics||[]).map((t,i)=>({t,i})).filter(x=>!q||(x.t.title+' '+x.t.tags+' '+x.t.blocks.map(b=>(b.text||'')+' '+(b.q||'')+' '+(b.a||'')).join(' ')).toLowerCase().includes(q)).map(x=>`<div class="topic ${x.i===ti?'active':''}" data-topic="${x.i}" onclick="ti=${x.i};renderAll()"><div style="display:flex;align-items:center;gap:8px"><span class="handle topic-handle" draggable="${q?'false':'true'}" title="Drag topic to reorder" onclick="event.stopPropagation()">☰</span><div><b>${esc(x.t.title)}</b><div class="small" style="color:#6b7280">${esc(x.t.tags||'')}</div></div></div></div>`).join('');if(!q)setupTopicDrag()}

function noteKind(b){return b.noteKind==='question'?'question':'note'}
function noteText(b){return b.noteText||''}

function sideNoteHTML(b){
  const text=noteText(b).trim();
  if(!text)return '';
  const kind=noteKind(b);
  return `<div class="side-note ${kind}">
    <div class="side-note-label">${kind==='question'?'Self-question':'Extra note'}</div>
    <div class="side-note-text">${rich(text)}</div>
  </div>`;
}

function blockNoteEditorHTML(b,i){
  return `<div class="block-note-editor">
    <div class="small"><b>Note / self-question for this section</b></div>
    <select onchange="upd(${i},'noteKind',this.value)">
      <option value="note" ${noteKind(b)==='note'?'selected':''}>Extra note</option>
      <option value="question" ${noteKind(b)==='question'?'selected':''}>Self-question</option>
    </select>
    <textarea oninput="grow(this)" onchange="upd(${i},'noteText',this.value)" placeholder="Optional — if you write something here, it appears beside this exact section in reading mode.">${esc(noteText(b))}</textarea>
  </div>`;
}

function renderEditor(){
  let t=cur();
  if(!t){
    editor.innerHTML='<div class="empty">Choose a topic.</div>';
    return;
  }

  modeBtn.textContent=readMode?'Edit / arrange':'Reading mode';

  if(readMode){
    editor.innerHTML=`<div class="lecture-title">${inlineRich(t.title)}</div><div class="lecture-tags">${esc(t.tags||'')}</div><div id="blockList">${t.blocks.map(readBlockHTML).join('')}</div>`;
    setTimeout(typesetMath,0);
    return;
  }

  editor.innerHTML=`<input class="title" value="${esc(t.title)}" onchange="tTitle(this.value)"><input class="tags" value="${esc(t.tags||'')}" placeholder="tags" onchange="tTags(this.value)"><div class="row"><button onclick="addBlock('heading')">+ Heading</button><button onclick="addBlock('text')">+ Text</button><button onclick="addBlock('formula')">+ Formula</button><button onclick="addImage()">+ Image</button><button onclick="addBlock('qa')">+ Q&A</button><button onclick="addBlock('exam')">+ Exam Hint</button><button class="danger" onclick="delTopic()">Delete topic</button><span class="small" style="color:#6b7280">Drag boxes using ☰. Add a note/question inside a block and it will appear beside that exact section in Reading mode.</span></div><div id="blockList">${t.blocks.map(blockHTML).join('')}</div>`;

  setupBlockDrag();
  growAll();
  setTimeout(typesetMath,0);
}
function toggleMode(){readMode=!readMode;renderEditor()}
function readBlockHTML(b,i){
  let main='';
  if(b.type==='heading')main=`<section class="read-block"><div class="read-heading">${inlineRich(b.text||'')}</div></section>`;
  else if(b.type==='text')main=`<section class="read-block read-text preview">${rich(b.text||'')}</section>`;
  else if(b.type==='formula')main=`<section class="read-block preview formula math-fallback">${rich(b.text||'')}</section>`;
  else if(b.type==='exam')main=`<section class="read-block read-exam preview">${rich(b.text||'')}</section>`;
  else if(b.type==='qa')main=`<section class="read-block"><details class="qa" open><summary>${inlineRich(b.q||'Question')}</summary><div class="preview">${rich(b.a||'')}</div></details></section>`;
  else if(b.type==='image')main=`<section class="read-block">${b.src?`<img class="noteimg" src="${b.src}" alt="${esc(b.caption||'Lecture image')}">`:''}${b.caption?`<div class="small" style="color:#6b7280;margin-top:6px">${inlineRich(b.caption)}</div>`:''}</section>`;
  else return '';

  const note=sideNoteHTML(b);
  return `<div class="read-pair ${note?'':'no-note'}"><div class="read-main">${main}</div>${note}</div>`;
}
function blockHTML(b,i){
  let h=`<div class="head"><div class="headleft"><span class="handle block-handle" draggable="true" data-index="${i}" title="Drag to reorder">☰</span><span class="type">${b.type}</span></div><div class="headright"><button onclick="moveBlock(${i},-1)" ${i===0?'disabled':''} title="Move up">↑</button><button onclick="moveBlock(${i},1)" ${i===cur().blocks.length-1?'disabled':''} title="Move down">↓</button><button class="danger" onclick="delBlock(${i})">Delete</button></div></div>`;
  let body='';
  if(b.type==='text')body=`<textarea oninput="grow(this)" onchange="upd(${i},'text',this.value)">${esc(b.text||'')}</textarea><div class="preview">${rich(b.text||'')}</div>`;
  else if(b.type==='formula')body=`<textarea oninput="grow(this)" onchange="upd(${i},'text',this.value)">${esc(b.text||'')}</textarea><div class="preview formula math-fallback">${rich(b.text||'')}</div>`;
  else if(b.type==='qa')body=`<input class="tags" value="${esc(b.q||'')}" placeholder="Question" onchange="upd(${i},'q',this.value)"><textarea oninput="grow(this)" onchange="upd(${i},'a',this.value)" placeholder="Answer">${esc(b.a||'')}</textarea><details class="qa" open><summary>${inlineRich(b.q||'Question')}</summary><div class="preview">${rich(b.a||'')}</div></details>`;
  else if(b.type==='image')body=`<img class="noteimg" src="${b.src}" alt="${esc(b.caption||'Lecture image')}"><input class="tags" value="${esc(b.caption||'')}" placeholder="Caption" onchange="upd(${i},'caption',this.value)">`;
  else if(b.type==='heading')body=`<input class="tags" value="${esc(b.text||'')}" placeholder="Section heading" onchange="upd(${i},'text',this.value)"><div class="headingpreview">${inlineRich(b.text||'')}</div>`;
  else if(b.type==='exam')body=`<textarea oninput="grow(this)" onchange="upd(${i},'text',this.value)">${esc(b.text||'')}</textarea><div class="exampreview preview">${rich(b.text||'')}</div>`;
  else return '';
  return `<div class="block" data-index="${i}">${h}${body}${blockNoteEditorHTML(b,i)}</div>`;
}
function tTitle(v){cur().title=v;save();renderTopics()}function tTags(v){cur().tags=v;save();renderTopics()}function upd(i,k,v){cur().blocks[i][k]=v;save();renderTopics();renderEditor()}

function moveBlock(i,d){let a=cur().blocks,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderEditor()}
let dragBlock=null;
function setupBlockDrag(){
  document.querySelectorAll('.block-handle').forEach(h=>{
    h.addEventListener('dragstart',e=>{
      dragBlock=Number(h.dataset.index);
      h.closest('.block')?.classList.add('dragging');
      if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragBlock))}
    });
    h.addEventListener('dragend',()=>{
      document.querySelectorAll('.block').forEach(b=>b.classList.remove('dragging','dragover'));
      dragBlock=null
    })
  });
  document.querySelectorAll('.block').forEach(b=>{
    b.addEventListener('dragover',e=>{if(dragBlock===null)return;e.preventDefault();if(Number(b.dataset.index)!==dragBlock)b.classList.add('dragover')});
    b.addEventListener('dragleave',()=>b.classList.remove('dragover'));
    b.addEventListener('drop',e=>{
      e.preventDefault();b.classList.remove('dragover');
      let to=Number(b.dataset.index),from=dragBlock;if(from===null||from===to)return;
      let a=cur().blocks,[m]=a.splice(from,1);a.splice(to,0,m);dragBlock=null;save();renderEditor()
    })
  })
}
let dragTopic=null;
function setupTopicDrag(){
  document.querySelectorAll('.topic-handle').forEach(h=>{
    h.addEventListener('dragstart',e=>{
      dragTopic=Number(h.closest('.topic').dataset.topic);
      h.closest('.topic').classList.add('dragging');
      if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragTopic))}
    });
    h.addEventListener('dragend',()=>{
      document.querySelectorAll('.topic').forEach(x=>x.classList.remove('dragging','dragover'));
      dragTopic=null
    })
  });
  document.querySelectorAll('.topic').forEach(x=>{
    x.addEventListener('dragover',e=>{if(dragTopic===null)return;e.preventDefault();if(Number(x.dataset.topic)!==dragTopic)x.classList.add('dragover')});
    x.addEventListener('dragleave',()=>x.classList.remove('dragover'));
    x.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();x.classList.remove('dragover');
      let to=Number(x.dataset.topic),from=dragTopic;if(from===null||from===to)return;
      let a=state.courses[ci].topics,[m]=a.splice(from,1);a.splice(to,0,m);
      if(ti===from)ti=to;else if(from<ti&&to>=ti)ti--;else if(from>ti&&to<=ti)ti++;
      dragTopic=null;save();renderAll()
    })
  })
}
function addBlock(type){readMode=false;let b=type==='qa'?{type:'qa',q:'New question',a:'Answer'}:type==='heading'?{type:'heading',text:'New section'}:type==='exam'?{type:'exam',text:'Exam hint'}:{type,text:''};cur().blocks.push(b);save();renderEditor()}
function addImage(){readMode=false;let x=document.createElement('input');x.type='file';x.accept='image/*';x.onchange=()=>{let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>compress(r.result,f.name);r.readAsDataURL(f)};x.click()}
function compress(src,name){let im=new Image();im.onload=()=>{let w=im.width,h=im.height,max=1400;if(w>max){h=Math.round(h*max/w);w=max}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cur().blocks.push({type:'image',src:c.toDataURL('image/jpeg',.82),caption:name});save();renderEditor()};im.src=src}
function delBlock(i){if(confirm('Delete this block?')){cur().blocks.splice(i,1);save();renderEditor()}}
function addTopic(){let n=prompt('Topic name?','New Topic');if(!n)return;state.courses[ci].topics.push({title:n,tags:'',blocks:[]});ti=state.courses[ci].topics.length-1;save();renderAll()}
function delTopic(){if(confirm('Delete this topic?')){state.courses[ci].topics.splice(ti,1);ti=0;save();renderAll()}}
function addCourse(){let n=prompt('Course name?','New Course');if(!n)return;state.courses.push({name:n,topics:[{title:'Start Here',tags:'',blocks:[]}]});ci=state.courses.length-1;ti=0;save();renderAll()}
function renameCourse(){let c=state.courses[ci],n=prompt('Course name?',c.name);if(!n)return;c.name=n;save();renderCourses()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='study-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.courses)throw 0;state=d;ci=0;ti=0;save();renderAll()}catch(_){alert('Invalid backup file')}};r.readAsText(f);e.target.value=''}
load();
</script>
</body></html>
